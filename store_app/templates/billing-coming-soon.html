<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing Coming Soon - StockOS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
<style>
:root{--ink:#0D0C2B;--brand:#1B175D;--accent:#6C63FF;--surface:#F5F4FF;--muted:#6B6A8A;--border:#E4E3F4}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--surface);color:var(--ink);font-family:'Google Sans','Product Sans',Arial,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(560px,100%);background:#fff;border:1px solid var(--border);border-radius:22px;padding:42px 36px;text-align:center;box-shadow:0 24px 70px rgba(27,23,93,.14)}
.icon{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:grid;place-items:center;font-size:34px;margin:0 auto 22px}
h1{font-size:58px;line-height:1;font-weight:800;color:var(--brand);margin-bottom:10px}
h2{font-size:28px;margin-bottom:10px}
p{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:26px}
a{height:44px;padding:0 20px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:700}
</style>
<link rel="stylesheet" href="/static/css/mobile-responsive.css">
</head>
<body>
<main class="card">
    <div class="icon"><i class="bi bi-receipt"></i></div>
    <h1>404</h1>
    <h2>Coming Soon</h2>
    <p>Billing section is coming soon till Tuesday.</p>
    <a href="/dashboard/"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
</main>
<script src="/static/js/mobile-sidebar.js"></script>
</body>
</html>
