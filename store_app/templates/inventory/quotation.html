<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotations - StockOS</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"><style>
:root{--brand:#1b175d;--bg:#f4f4fb;--line:#d9d9e8}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#191833}.side{position:fixed;inset:0 auto 0 0;width:80px;background:var(--brand);padding:20px 8px;display:flex;flex-direction:column;gap:8px}.side a{color:#ffffff99;text-decoration:none;text-align:center;font-size:10px;padding:9px 2px;border-radius:12px}.side i{display:block;font-size:19px;margin-bottom:3px}.side a.active,.side a:hover{background:#ffffff24;color:white}.main{margin-left:80px;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.workspace{display:grid;grid-template-columns:minmax(480px,1fr) minmax(430px,.9fr);gap:18px}.panel,.paper{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 5px 24px #17135d0c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}label{font-size:11px;font-weight:bold;color:#65647b}input,select,textarea{width:100%;margin-top:5px;padding:9px;border:1px solid var(--line);border-radius:8px;background:white}textarea{min-height:58px}.section{border-top:1px solid var(--line);margin-top:15px;padding-top:14px}.section h3{margin:0 0 10px}.product-row{display:grid;grid-template-columns:2.3fr .7fr 1fr .7fr 32px;gap:7px;margin-bottom:8px}.btn{border:0;border-radius:9px;background:var(--brand);color:white;padding:10px 14px;cursor:pointer;font-weight:bold}.btn.alt{background:#eeedf8;color:var(--brand)}.actions{display:flex;gap:8px;margin-top:16px}.paper{position:sticky;top:20px;align-self:start;border-radius:3px;min-height:700px;padding:28px;color:#111}.qtitle{text-align:center;font-size:24px;font-weight:bold;border-bottom:2px solid #111;padding-bottom:10px}.company{display:flex;justify-content:space-between;border-bottom:1px solid #111;padding:12px 0}.to{padding:12px 0}.preview-table{width:100%;border-collapse:collapse;font-size:11px}.preview-table th,.preview-table td{border:1px solid #555;padding:6px}.preview-table th{background:#eee}.totals{margin-left:auto;margin-top:8px;width:48%;font-size:12px}.totals div{display:flex;justify-content:space-between;border-bottom:1px solid #aaa;padding:5px}.totals .grand{font-weight:bold;background:#eee}.saved{margin-top:20px}.saved a{color:var(--brand)}dialog{border:0;border-radius:14px;max-width:620px;width:90%;padding:20px}dialog::backdrop{background:#0008}@media(max-width:1050px){.workspace{grid-template-columns:1fr}.paper{position:static}.side{display:none}.main{margin-left:0}}@media print{.side,.head,.panel{display:none}.main{margin:0;padding:0}.workspace{display:block}.paper{border:0;box-shadow:none}}
</style></head><body><nav class="side"><a href="/dashboard/"><i class="bi bi-speedometer2"></i>Dashboard</a><a href="/api/items/"><i class="bi bi-grid"></i>Items</a><a href="/api/orders-page/"><i class="bi bi-truck"></i>Orders</a><a class="active" href="/api/quotations/"><i class="bi bi-file-earmark-text"></i>Quotation</a><a href="/logout/"><i class="bi bi-box-arrow-right"></i>Logout</a></nav>
<main class="main"><div class="head"><div><h1 style="margin:0">{% if editing_id %}Edit{% else %}Create{% endif %} Quotation</h1><small>Create, preview, save and download</small></div><div class="actions"><a class="btn alt" href="/api/quotations/" style="text-decoration:none"><i class="bi bi-list"></i> Quotation List</a><button class="btn alt" onclick="settingsDialog.showModal()"><i class="bi bi-bank"></i> Company & Bank Settings</button></div></div><div class="workspace"><section class="panel"><div class="grid"><label>Quotation No<input id="number" value="{{ next_number }}"></label><label>Date<input id="quote_date" type="date" value="{{ today }}"></label><label>Customer Name<input id="customer_name" list="customers"></label><label>Phone<input id="customer_phone"></label><label>Email<input id="customer_email" type="email"></label><label>GSTIN<input id="customer_gstin"></label><label class="full">Customer Address<textarea id="customer_address"></textarea></label><label>Valid Until<input id="valid_until" type="date" value="{{ valid_until }}"></label><label>Shipping Amount<input id="shipping_amount" type="number" step=".01" value="0"></label><label class="full">Shipment Details<textarea id="shipment_details" placeholder="Transport, delivery date, freight terms..."></textarea></label></div><datalist id="customers"></datalist><datalist id="productOptions"></datalist>
<div class="section"><h3>Products</h3><div id="productRows"></div><button class="btn alt" onclick="addRow()">+ Add Product</button></div><div class="section"><label>Notes<textarea id="notes"></textarea></label></div><div class="actions"><button id="saveBtn" class="btn" onclick="saveQuote()">{% if editing_id %}Update{% else %}Save{% endif %} Quotation</button><button class="btn alt" onclick="window.print()">Print Preview</button><a id="downloadBtn" class="btn" {% if editing_id %}href="/api/quotations/{{ editing_id }}/pdf/"{% endif %} style="{% if not editing_id %}display:none;{% endif %}text-decoration:none">Download PDF</a></div></section>
<aside class="paper" id="preview"><div class="qtitle">QUOTATION</div><div class="company"><div id="pCompany"></div><div id="pMeta"></div></div><div class="to" id="pCustomer"></div><table class="preview-table"><thead><tr><th>#</th><th>Description</th><th>HSN</th><th>Qty</th><th>Rate</th><th>GST</th><th>Amount</th></tr></thead><tbody id="pItems"></tbody></table><div class="totals"><div><span>Subtotal</span><b id="pSubtotal"></b></div><div><span>GST</span><b id="pTax"></b></div><div><span>Shipping</span><b id="pShipping"></b></div><div class="grand"><span>Grand Total</span><b id="pGrand"></b></div></div><p id="pShipment"></p><p id="pBank"></p><p id="pTerms"></p></aside></div></main>
<dialog id="settingsDialog"><h2>Company & Bank Details</h2><div class="grid" id="settingsFields"></div><div class="actions"><button class="btn" onclick="saveSettings()">Save Permanently</button><button class="btn alt" onclick="settingsDialog.close()">Cancel</button></div></dialog>
<script>
const products={{ products_json|safe }},customers={{ customers_json|safe }},initialQuote={{ quote_json|safe }};let company={{ company_json|safe }},rowId=0,savedId={{ editing_id|default:"null" }};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const productSection=$('productRows').closest('.section');productSection.insertAdjacentHTML('beforebegin',`<div class="section"><h3>Consignee (Ship To)</h3><div class="grid"><label>Name<input id="consignee_name"></label><label>GSTIN<input id="consignee_gstin"></label><label class="full">Address<textarea id="consignee_address"></textarea></label><label>State<input id="consignee_state"></label><label>State Code<input id="consignee_state_code"></label></div></div><div class="section"><h3>Voucher & Dispatch Details</h3><div class="grid"><label>Mode/Terms of Payment<input id="payment_terms"></label><label>Buyer's Ref./Order No.<input id="buyer_reference"></label><label>Other References<input id="other_references"></label><label>Dispatched Through<input id="dispatched_through"></label><label>Destination<input id="destination"></label><label>Terms of Delivery<input id="delivery_terms"></label><label>Buyer State<input id="customer_state"></label><label>Buyer State Code<input id="customer_state_code"></label></div></div>`);productSection.querySelector('h3').insertAdjacentHTML('afterend','<div style="display:grid;grid-template-columns:2.2fr .9fr .65fr .6fr .9fr .6fr .6fr 32px;gap:7px;font-size:9px;font-weight:bold;color:#65647b"><span>Product</span><span>Due on</span><span>Qty</span><span>Unit</span><span>Price</span><span>Disc.%</span><span>GST</span><span></span></div>');
$('preview').innerHTML=`<div class="qtitle">QUOTATION</div><div style="display:grid;grid-template-columns:1.15fr 1fr;border:1px solid #333;font-size:9px"><div style="padding:6px;border-right:1px solid #333"><div id="pCompany"></div><hr><small>Consignee (Ship to)</small><div id="pConsignee"></div><hr><small>Buyer (Bill to)</small><div id="pCustomer"></div></div><div id="pMeta" style="display:grid;grid-template-columns:1fr 1fr"></div></div><table class="preview-table"><thead><tr><th>Sl</th><th>Description of Goods and Services</th><th>Due on</th><th>Quantity</th><th>Rate</th><th>per</th><th>Disc.%</th><th>Amount</th></tr></thead><tbody id="pItems"></tbody></table><div class="totals"><div><span>Taxable Total</span><b id="pSubtotal"></b></div><div><span>Output GST</span><b id="pTax"></b></div><div><span>Shipping Charges</span><b id="pShipping"></b></div><div class="grand"><span>Grand Total</span><b id="pGrand"></b></div></div><p id="pWords"></p><p id="pShipment"></p><p id="pBank"></p><p id="pTerms"></p><div style="height:90px;border:1px solid #333;text-align:right;padding:8px"><b id="pSignatory"></b><br><br><br>Authorised Signatory</div><div style="text-align:center;font-size:9px;margin-top:8px">This is a Computer Generated Document</div>`;
customers.forEach((c,i)=>{let o=document.createElement('option');o.value=c.customer_name;o.dataset.i=i;$('customers').appendChild(o)});products.forEach(p=>{let o=document.createElement('option');o.value=`${p.name} (${p.sku})`;$('productOptions').appendChild(o)});$('customer_name').addEventListener('change',e=>{let c=customers.find(x=>x.customer_name===e.target.value);if(c){$('customer_phone').value=c.mobile||'';$('customer_email').value=c.customer_email||''}render()});
function addRow(item=null){let id=++rowId,d=document.createElement('div'),selected=products.find(p=>p.id==item?.product_id);d.className='product-row';d.style.gridTemplateColumns='2.2fr .9fr .65fr .6fr .9fr .6fr .6fr 32px';d.id='row'+id;d.innerHTML=`<div><input class="product-search" list="productOptions" placeholder="Search name / SKU" value="${esc(selected?`${selected.name} (${selected.sku})`:(item?.product_name||''))}"><input class="product" type="hidden" value="${selected?.id||item?.product_id||''}"></div><input class="due" type="date" value="${item?.due_on||$('valid_until').value}"><input class="qty" type="number" value="${item?.quantity||1}" min=".01" step=".01"><input class="unit" value="${esc(item?.unit||'PCS')}"><input class="price" type="number" value="${item?.unit_price??selected?.price??0}" step=".01" title="Price is editable"><input class="discount" type="number" value="${item?.discount_percentage||0}" step=".01"><select class="gst"><option value="5">5%</option><option value="18">18%</option></select><button class="btn alt" onclick="this.parentNode.remove();render()">×</button>`;d.querySelector('.gst').value=String(parseFloat(item?.gst_percentage||5));d.querySelector('.product-search').onchange=e=>{let p=products.find(x=>`${x.name} (${x.sku})`===e.target.value)||products.find(x=>x.name===e.target.value),price=d.querySelector('.price');d.querySelector('.product').value=p?.id||'';if(p){price.value=p.price;price.title=`${p.price_source}: ${p.price} - editable`;}render()};d.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',render));$('productRows').appendChild(d);render()}
function rows(){return [...document.querySelectorAll('.product-row')].map(r=>{let p=products.find(x=>x.id==r.querySelector('.product').value),q=+r.querySelector('.qty').value||0,price=+r.querySelector('.price').value||0,gst=+r.querySelector('.gst').value,disc=+r.querySelector('.discount').value||0,taxable=q*price*(100-disc)/100;return p?{product_id:p.id,product_name:p.name,sku:p.sku,hsn_code:p.hsn,due_on:r.querySelector('.due').value,quantity:q,unit:r.querySelector('.unit').value,unit_price:price,discount_percentage:disc,gst_percentage:gst,taxable:taxable,tax:taxable*gst/100}:null}).filter(Boolean)}
function render(){let rs=rows(),sub=rs.reduce((a,x)=>a+x.taxable,0),tax=rs.reduce((a,x)=>a+x.tax,0),ship=+$('shipping_amount').value||0;$('pCompany').innerHTML=`<b>${esc(company.company_name||'Company Name')}</b><br>${esc(company.address||'')}<br>GSTIN: ${esc(company.gstin||'-')}<br>${esc(company.phone||'')}`;$('pMeta').innerHTML=`<b>No:</b> ${esc($('number').value)}<br><b>Date:</b> ${esc($('quote_date').value)}<br><b>Valid:</b> ${esc($('valid_until').value)}`;$('pCustomer').innerHTML=`<b>Quotation To:</b><br>${esc($('customer_name').value)}<br>${esc($('customer_address').value)}<br>${esc($('customer_phone').value)} ${esc($('customer_email').value)}<br>GSTIN: ${esc($('customer_gstin').value)}`;$('pItems').innerHTML=rs.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.product_name)}<br><small>${esc(x.sku)}</small></td><td>${esc(x.hsn_code)}</td><td>${x.quantity}</td><td>${x.unit_price.toFixed(2)}</td><td>${x.gst_percentage}%</td><td>${(x.taxable+x.tax).toFixed(2)}</td></tr>`).join('');$('pSubtotal').textContent='₹'+sub.toFixed(2);$('pTax').textContent='₹'+tax.toFixed(2);$('pShipping').textContent='₹'+ship.toFixed(2);$('pGrand').textContent='₹'+(sub+tax+ship).toFixed(2);$('pShipment').innerHTML='<b>Shipment:</b> '+esc($('shipment_details').value||'-');$('pBank').innerHTML=`<b>Bank:</b> ${esc(company.bank_name||'-')}, A/C ${esc(company.account_number||'-')}, IFSC ${esc(company.ifsc||'-')}`;$('pTerms').innerHTML='<b>Terms:</b> '+esc(company.terms||'')}
function render(){let rs=rows(),sub=rs.reduce((a,x)=>a+x.taxable,0),tax=rs.reduce((a,x)=>a+x.tax,0),ship=+$('shipping_amount').value||0;$('pCompany').innerHTML=`<b>${esc(company.company_name||'Company Name')}</b><br>${esc(company.address||'')}<br>GSTIN/UIN: ${esc(company.gstin||'-')}<br>E-Mail: ${esc(company.email||'')}`;$('pConsignee').innerHTML=`<b>${esc($('consignee_name').value||$('customer_name').value)}</b><br>${esc($('consignee_address').value||$('customer_address').value)}<br>GSTIN/UIN: ${esc($('consignee_gstin').value||$('customer_gstin').value)}<br>State: ${esc($('consignee_state').value)} Code: ${esc($('consignee_state_code').value)}`;$('pCustomer').innerHTML=`<b>${esc($('customer_name').value)}</b><br>${esc($('customer_address').value)}<br>GSTIN/UIN: ${esc($('customer_gstin').value)}<br>State: ${esc($('customer_state').value)} Code: ${esc($('customer_state_code').value)}`;let meta=[['Voucher No.',$('number').value],['Dated',$('quote_date').value],['Mode/Terms of Payment',$('payment_terms').value],["Buyer's Ref./Order No.",$('buyer_reference').value],['Other References',$('other_references').value],['Dispatched through',$('dispatched_through').value],['Destination',$('destination').value],['Terms of Delivery',$('delivery_terms').value]];$('pMeta').innerHTML=meta.map(x=>`<div style="border-bottom:1px solid #333;padding:5px;min-height:38px"><small>${esc(x[0])}</small><br><b>${esc(x[1])}</b></div>`).join('');$('pItems').innerHTML=rs.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.product_name)}</b><br><small>${esc(x.sku)}</small></td><td>${esc(x.due_on)}</td><td><b>${x.quantity} ${esc(x.unit)}</b></td><td>${x.unit_price.toFixed(2)}</td><td>${esc(x.unit)}</td><td>${x.discount_percentage}%</td><td><b>${x.taxable.toFixed(2)}</b></td></tr>`).join('');$('pSubtotal').textContent='₹'+sub.toFixed(2);$('pTax').textContent='₹'+tax.toFixed(2);$('pShipping').textContent='₹'+ship.toFixed(2);$('pGrand').textContent='₹'+(sub+tax+ship).toFixed(2);$('pWords').innerHTML='<small>Amount Chargeable (in words)</small><br><b>INR '+(sub+tax+ship).toFixed(2)+' Only</b>';$('pShipment').innerHTML='<b>Shipment:</b> '+esc($('shipment_details').value||'-');$('pBank').innerHTML=`<b>Bank:</b> ${esc(company.bank_name||'-')}, A/C ${esc(company.account_number||'-')}, IFSC ${esc(company.ifsc||'-')}`;$('pTerms').innerHTML='<b>Terms:</b> '+esc(company.terms||'');$('pSignatory').textContent='for '+(company.company_name||'Company')}
const settingNames=['company_name','address','gstin','phone','email','bank_name','account_name','account_number','ifsc','branch','terms'];$('settingsFields').innerHTML=settingNames.map(n=>`<label class="${['address','terms'].includes(n)?'full':''}">${n.replaceAll('_',' ').toUpperCase()}${['address','terms'].includes(n)?`<textarea id="s_${n}">${esc(company[n]||'')}</textarea>`:`<input id="s_${n}" value="${esc(company[n]||'')}">`}</label>`).join('');
async function saveSettings(){let data={};settingNames.forEach(n=>data[n]=$('s_'+n).value);let r=await fetch('/api/quotations/settings/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':cookie('csrftoken')},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)return alert(j.detail||'Could not save');company=j.settings;settingsDialog.close();render();alert('Company and bank details saved.')}
function payload(){let ids=['number','quote_date','valid_until','customer_name','customer_phone','customer_email','customer_address','customer_gstin','customer_state','customer_state_code','consignee_name','consignee_address','consignee_gstin','consignee_state','consignee_state_code','payment_terms','buyer_reference','other_references','dispatched_through','destination','delivery_terms','shipment_details','shipping_amount','notes'],p={};ids.forEach(id=>p[id]=$(id).value);if(savedId)p.id=savedId;p.items=rows();return p}
async function saveQuote(){let b=$('saveBtn');b.disabled=true;let r=await fetch('/api/quotations/save/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':cookie('csrftoken')},body:JSON.stringify(payload())});let j=await r.json();b.disabled=false;if(!r.ok)return alert(j.detail||'Could not save');savedId=j.id;$('downloadBtn').href=j.download_url;$('downloadBtn').style.display='inline-block';alert('Quotation '+j.number+' saved successfully.')}
function cookie(n){return document.cookie.split('; ').find(x=>x.startsWith(n+'='))?.split('=')[1]||''}document.querySelectorAll('input,textarea').forEach(x=>x.addEventListener('input',render));if(initialQuote){Object.entries(initialQuote).forEach(([key,value])=>{if(key!=='items'&&$(key))$(key).value=value??''});initialQuote.items.forEach(addRow)}else addRow();render();
</script><script src="/static/js/quotation-preview.js"></script></body></html>
