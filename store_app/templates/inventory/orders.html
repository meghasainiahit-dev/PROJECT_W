{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders - StockOS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
<style>
:root{--ink:#0D0C2B;--brand:#1B175D;--accent:#6C63FF;--surface:#F5F4FF;--muted:#6B6A8A;--border:#E4E3F4;--green:#2EAA65;--danger:#EF4444}
*{box-sizing:border-box;margin:0;padding:0}body{font-family: 'Google Sans', 'Product Sans', Arial, sans-serif;background:var(--surface);color:var(--ink)}h1{font-family: 'Google Sans', 'Product Sans', Arial, sans-serif}
.sidebar{width:80px;background:var(--brand);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;align-items:center;padding:22px 0;gap:4px}.sidebar-logo{width:42px;height:42px;background:#fff;border-radius:14px;display:grid;place-items:center;font-weight:800;color:var(--brand);text-decoration:none;margin-bottom:16px}.sidebar-label{font-size:8px;color:#ffffff55;text-transform:uppercase;margin:8px 0 4px}.nav-link{width:56px;height:52px;border-radius:14px;color:#ffffff77;text-decoration:none;display:grid;place-items:center;font-size:9px}.nav-link i{font-size:18px}.nav-link.active{background:#ffffff2b;color:#fff}.spacer{flex:1}
.main{margin-left:80px;min-height:100vh}.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;height:62px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}.top-search{max-width:420px;flex:1;position:relative}.top-search i,.order-search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:11px 14px 11px 38px;outline:none;font-size:13px}.top-actions{margin-left:auto;display:flex;gap:10px}.icon-btn{width:40px;height:40px;border:0;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center}
.content{padding:24px 28px;display:grid;gap:22px}.head{display:flex;justify-content:space-between;gap:14px}.head h1{font-size:24px}.head p{font-size:13px;color:var(--muted)}.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}.icon-btn{width:36px;height:36px;background:var(--brand);border:0;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;text-decoration:none;transition:all .2s;cursor:pointer}.icon-btn:hover{background:var(--brand-mid);transform:translateY(-1px)}.add-btn{height:40px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;text-decoration:none;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 6px 20px #1b175d40}
.tabs{display:flex;gap:8px;overflow-x:auto}.tab{border:1.5px solid var(--border);background:#fff;color:var(--muted);border-radius:999px;padding:8px 16px;white-space:nowrap;font-size:12px;cursor:pointer}.tab.active{border-color:var(--accent);color:var(--brand);font-weight:700}
.order-search{position:relative}.drop{display:none;position:absolute;top:52px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px #1b175d22;z-index:20}.drop.show{display:block}.drop a{display:flex;justify-content:space-between;padding:12px 16px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border)}
.list{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:10px 1fr auto;gap:14px;align-items:center;text-decoration:none;color:var(--ink);box-shadow:0 4px 20px #1b175d0a}.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #edfdf4}.body h3{font-size:15px;font-weight:700;margin-bottom:4px}.body p,.body small{font-size:12px;color:var(--muted)}.right{display:grid;justify-items:end;gap:8px}.badge{border:1px solid #2563EB;background:#DBEAFE;color:#1D4ED8;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700}.del{border:0;background:transparent;color:var(--danger);font-size:18px;cursor:pointer}.empty{background:#fff;border:1px solid var(--border);border-radius:18px;padding:52px 20px;text-align:center;color:var(--muted)}
.badge.in-process{border-color:#E9B72D;background:#FFF3CE;color:#956600}.badge.packed{border-color:#7EC9D3;background:#E4FAFC;color:#147384}.badge.delivered,.badge.received{border-color:#88CCA0;background:#E5F7EB;color:#19733D}.badge.courier-return,.badge.customer-return,.badge.returned{border-color:#E6A861;background:#FFF0E0;color:#9A5411}.badge.cancelled{border-color:#F4A3A3;background:#FDEBEC;color:#C52935}
.bottom{display:none}.mobile-menu,.mobile-notify,.mobile-qr{display:none}.search-wrap{flex:1;max-width:336px;position:relative}.search-wrap i,.order-search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.search-wrap input,.order-search input{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:9px 14px 9px 38px;font-family: 'Google Sans', 'Product Sans', Arial, sans-serif;font-size:13px;color:var(--ink);outline:none;transition:border-color .2s}.search-wrap input{height:34px}.search-wrap input:focus,.order-search input:focus{border-color:var(--accent)}
@media(max-width:760px){.sidebar{display:none}.main{margin-left:0}.topbar{height:110px;background:#FAFAFA;border:0;box-shadow:0 8px 22px #0d0c2b0a;padding:22px 36px 10px;justify-content:space-between}.top-search,.desktop-action{display:none}.mobile-menu,.mobile-notify,.mobile-qr{display:grid}.mobile-menu{width:36px;height:36px;border:1px solid var(--border);border-radius:10px;background:#F0F0F3;color:var(--brand);place-items:center}.mobile-notify{position:relative}.mobile-notify span{position:absolute;top:4px;left:7px;background:#F04A4A;color:#fff;border-radius:50%;width:18px;height:18px;font-size:9px;display:grid;place-items:center}.content{padding:12px 35px 96px;gap:14px;background:#FAFAFA}.head{display:block}.head h1{font-size:20px}.head p{font-size:10px}.add-btn{position:fixed;right:22px;bottom:92px;width:48px;height:48px;padding:0;font-size:0;justify-content:center;z-index:30}.add-btn i{font-size:22px}.tab{font-size:10px;padding:8px 15px}.card{border-radius:10px;padding:14px 13px;min-height:76px;box-shadow:none}.body h3{font-size:13px}.body p,.body small{font-size:9.5px}.badge{font-size:8.5px;padding:3px 9px}.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:40}.bottom a{text-decoration:none;color:#777;display:grid;place-items:center;font-size:10px}.bottom i{font-size:18px}.bottom a.active i{width:45px;height:45px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;margin-top:-20px}}
</style>
<link rel="stylesheet" href="/static/css/mobile-responsive.css">
</head>
<body>
<nav class="sidebar">
<a href="/api/home" class="sidebar-logo">OS</a>
<span class="sidebar-label">Main</span>
<a href="/api/home" class="nav-link"><i class="bi bi-speedometer2"></i><span>Dash</span></a>
    <a href="/dashboard/" class="nav-link"><i class="bi bi-info-circle"></i><span>Main Info</span></a>
<a href="/api/inventory-page/" class="nav-link"><i class="bi bi-box"></i><span>inventory</span></a>
<a href="/billing/" class="nav-link"><i class="bi bi-receipt"></i><span>Billing</span></a>
<a href="/api/purchase-page/" class="nav-link"><i class="bi bi-bag"></i><span>Purchase</span></a>
<a href="/api/items/" class="nav-link"><i class="bi bi-grid-1x2"></i><span>Items</span></a>
<a href="/api/vendors-page/" class="nav-link"><i class="bi bi-people"></i><span>Vendors</span></a>
<a href="/api/orders-page/" class="nav-link active"><i class="bi bi-truck"></i><span>Orders</span></a>
<a href="/api/couriers-page/" class="nav-link"><i class="bi bi-send"></i><span>Courier</span></a>
<div class="spacer"></div>
<a href="/settings/" class="nav-link"><i class="bi bi-gear"></i><span>Settings</span></a>
<a href="/logout/" class="nav-link"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
</nav>

<div class="main">
<header class="topbar">
<button class="mobile-menu" type="button"><i class="bi bi-list"></i></button>
<div class="top-search"><i class="bi bi-search"></i><input placeholder="Search items, vendors & orders..."></div>
<div class="top-actions">
<button class="icon-btn mobile-notify"><span>124</span><i class="bi bi-bell"></i></button>
<button class="icon-btn mobile-qr"><i class="bi bi-qr-code-scan"></i></button>
<a href="/settings/" class="icon-btn desktop-action"><i class="bi bi-gear"></i></a>
<button class="icon-btn desktop-action"><i class="bi bi-bar-chart-line"></i></button>
</div>
</header>

<main class="content">
<section class="head">
<div><h1>Orders</h1><p>View and manage your recent transactions</p></div>
<a class="add-btn" href="/api/create-order/"><i class="bi bi-plus-lg"></i> Create Order</a>
</section>

<nav class="tabs" id="tabs">
<button class="tab active" data-status="ALL">✓ All</button>
<button class="tab" data-status="IN_PROCESS">In Process</button>
<button class="tab" data-status="PACKED">Packed</button>
<button class="tab" data-status="IN_TRANSIT">In Transit</button>
<button class="tab" data-status="DELIVERED">Delivered</button>
<button class="tab" data-status="COURIER_RETURN">Courier Return</button>
<button class="tab" data-status="CUSTOMER_RETURN">Customer Return</button>
<button class="tab" data-status="RETURNED">Returned</button>
</nav>

<section class="order-search">
<i class="bi bi-search"></i>
<input id="searchInput" type="search" placeholder="Search by ID or customer name..." autocomplete="off">
<div id="drop" class="drop"></div>
</section>

<section id="ordersList" class="list"><div class="empty">Loading orders...</div></section>
</main>
</div>

<nav class="bottom">
<a href="/api/home"><i class="bi bi-house-door-fill"></i><span>Home</span></a>
<a href="/api/items/"><i class="bi bi-box-seam-fill"></i><span>Items</span></a>
<a href="/api/vendors-page/"><i class="bi bi-people-fill"></i><span>Vendors</span></a>
<a class="active" href="/api/orders-page/"><i class="bi bi-cart-fill"></i><span>Orders</span></a>
</nav>

<script>
const API=window.API_BASE||(location.protocol==="file:"?"http://127.0.0.1:8000":"");
const list=document.getElementById("ordersList"),searchInput=document.getElementById("searchInput"),drop=document.getElementById("drop"),tabs=document.getElementById("tabs");
let activeStatus="ALL",timer;

const API_TOKEN_KEY="stockos_api_token";
async function ensureToken(){
let token=localStorage.getItem(API_TOKEN_KEY);
if(token)return token;
const res=await fetch(`${API}/api/login/`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({otp:"000000"})});
const data=await res.json();
if(!res.ok||!data.token)throw new Error(data.error||"API login failed.");
localStorage.setItem(API_TOKEN_KEY,data.token);
return data.token;
}
async function apiFetch(url,options={},retry=true){
const token=await ensureToken();
const requestHeaders=new Headers(options.headers||{});
requestHeaders.set("Authorization",`Bearer ${token}`);
if(!(options.body instanceof FormData)&&!requestHeaders.has("Content-Type"))requestHeaders.set("Content-Type","application/json");
const res=await fetch(url,{...options,headers:requestHeaders});
if(res.status===401&&retry){localStorage.removeItem(API_TOKEN_KEY);return apiFetch(url,options,false);}
return res;
}
function appUrl(path){return location.protocol==="file:"?`${API}${path}`:path}
function cleanStatus(s){return String(s||"Active").replaceAll("_"," ").toLowerCase().replace(/\b\w/g,l=>l.toUpperCase())}
function date(o){return o.date||(o.created_at?String(o.created_at).slice(0,10):"")}
function detailUrl(id){return appUrl(`/api/order-ui-details/?id=${id}`)}
function card(o){
const s=cleanStatus(o.status),ch=o.channel||o.channel_name||"";
const statusClass=String(o.status||"").toLowerCase().replaceAll("_","-").replaceAll(" ","-");
return `<a class="card" href="${detailUrl(o.id)}">
<span class="dot"></span>
<div class="body"><h3>${o.customer_name||""}</h3><p>ID: #${o.id} · ${date(o)}</p><small>${ch}</small></div>
<div class="right"><span class="badge ${statusClass}">${s}</span><button class="del" onclick="event.preventDefault();event.stopPropagation();delOrder(${o.id})"><i class="bi bi-trash"></i></button></div>
</a>`;
}
function render(orders){list.innerHTML=orders.length?orders.map(card).join(""):`<div class="empty">No orders found</div>`}
function renderDrop(orders,q){
if(!q||!orders.length){drop.classList.remove("show");drop.innerHTML="";return}
drop.innerHTML=orders.slice(0,6).map(o=>`<a href="${detailUrl(o.id)}"><div><b>${o.customer_name||""}</b><br><span>ID: #${o.id}</span></div><span>${cleanStatus(o.status)}</span></a>`).join("");
drop.classList.add("show");
}
async function loadOrders(){
const q=searchInput.value.trim(),params=new URLSearchParams();
params.set("status",activeStatus); if(q)params.set("search",q);
list.innerHTML=`<div class="empty">Loading orders...</div>`;
try{
const res=await apiFetch(`${API}/api/order-ui-list/?${params}`);
if(!res.ok)throw new Error();
const data=await res.json(),orders=data.data||data.results||(Array.isArray(data)?data:[]);
render(orders); renderDrop(orders,q);
}catch(e){list.innerHTML=`<div class="empty">Could not load orders.</div>`;drop.classList.remove("show")}
}
async function delOrder(id){
if(!confirm("Delete this order?"))return;
const res=await apiFetch(`${API}/api/order-ui-delete/${id}/`,{method:"DELETE"});
if(res.ok)loadOrders();else alert("Delete failed");
}
tabs.addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;activeStatus=b.dataset.status;tabs.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");loadOrders()});
searchInput.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(loadOrders,280)});
document.addEventListener("click",e=>{if(!e.target.closest(".order-search"))drop.classList.remove("show")});
loadOrders();
</script>
<script src="/static/js/mobile-sidebar.js"></script>
</body>
</html>
