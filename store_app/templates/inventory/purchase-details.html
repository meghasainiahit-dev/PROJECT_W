<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchase Bill Details - StockOS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
<style>
:root{--navy:#211d63;--indigo:#4c4592;--ink:#19173d;--muted:#777786;--line:#edebf1;--bg:#fafafa;--green:#1a9d3e;--red:#ea363b;--blue:#daeeff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family: 'Google Sans', 'Product Sans', Arial, sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.side{display:none}.hero{background:linear-gradient(115deg,var(--navy),#3f3987);color:#fff;padding:19px 17px 17px}.heading{display:flex;align-items:center;gap:13px}.back{width:35px;height:35px;border-radius:8px;background:rgba(255,255,255,.17);display:grid;place-items:center}.heading h1{font-size:16px;margin:0;flex:1}.badge{font-size:9px;border:1px solid;border-radius:12px;padding:6px 10px}.PAID{color:#2dd15c;border-color:#31cd5b}.UNPAID{color:#ffc24d}.PARTIAL{color:#72c5ff}.billbar{margin-top:11px;border-radius:8px;background:rgba(255,255,255,.17);height:43px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;font-size:11px}.body{padding:14px}.box{background:#fff;border-radius:13px;padding:15px 13px;margin-bottom:12px;box-shadow:0 2px 8px rgba(20,18,53,.04)}.vendor{display:flex;align-items:center;gap:13px}.avatar{height:45px;width:45px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:#fff;font-weight:600}.vendor b{display:block;font-size:13px}.vendor small{font-size:10px;color:var(--muted)}.label{font-size:9px;color:#577080;letter-spacing:.13em;font-weight:600;margin:0 0 14px}.row{display:flex;justify-content:space-between;font-size:11px;margin:9px 0;color:var(--muted)}.row b{color:var(--ink);font-weight:600}.tax-break{border-top:1px solid #d8d8e0;margin:12px 0 10px;padding-top:11px;font-size:9px;color:#577080;letter-spacing:.13em;font-weight:600}.row.total{border-top:1px solid #d8d8e0;padding-top:12px;margin-top:12px}.row.total b{color:var(--navy);font-size:13px}.row.paid b{color:var(--green)}.row.due b{color:var(--red)}.items-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin:18px 1px 10px}.pill{font-size:9px;border-radius:12px;background:var(--navy);color:#fff;padding:6px 11px}.item{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:9px}.item-top{display:flex;gap:12px;padding:13px}.number{height:28px;width:28px;background:var(--navy);border-radius:50%;color:#fff;display:grid;place-items:center;font-size:11px}.item-name{font-size:11px;font-weight:600}.sku{font-size:8px;color:var(--muted)}.item-bottom{display:flex;justify-content:space-between;background:#fafafa;border-top:1px solid var(--line);padding:10px 13px;font-size:10px;color:var(--muted)}.item-bottom b{color:var(--navy);font-size:12px}.note{background:var(--blue);border:1px solid #81c4ff;color:#0869c6;border-radius:11px;padding:13px;font-size:11px}.note b{display:block;margin-bottom:5px}.error{text-align:center;color:var(--red);margin:28px}
@media(min-width:900px){.side{display:flex;position:fixed;inset:0 auto 0 0;width:80px;background:var(--navy);flex-direction:column;align-items:center;padding-top:20px;gap:9px}.side a{color:rgba(255,255,255,.64);height:54px;width:58px;border-radius:12px;display:grid;place-items:center}.side .logo{height:43px;width:43px;background:white;color:var(--navy);font-weight:700;margin-bottom:16px}.side .active{background:rgba(255,255,255,.16);color:white}.page{margin-left:80px}.hero{padding:24px 42px 25px}.heading,.billbar,.body{max-width:760px;margin-left:auto;margin-right:auto}.heading h1{font-size:23px}.billbar{margin-top:16px;height:45px}.body{padding:20px 0 35px;display:block}.box{padding:19px 20px;border:1px solid #f2f1f5;box-shadow:0 4px 14px rgba(20,18,53,.045)}.items-wrap{margin-top:3px}.items{display:block}.item{margin-bottom:9px}}
@media(min-width:900px){.side{padding:22px 0 16px;gap:4px;box-shadow:4px 0 30px rgba(27,23,93,.18)}.side .logo{width:42px;height:42px;border-radius:14px;margin-bottom:14px;font-size:15px;display:flex;align-items:center;justify-content:center}.side .sidebar-label{height:auto;width:auto;display:block;border-radius:0;color:rgba(255,255,255,.28);font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 4px}.side .nav-link{width:56px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;gap:4px;color:rgba(255,255,255,.48);font-size:9px}.side .nav-link i{font-size:18px}.side .nav-link:hover,.side .nav-link.active{background:rgba(255,255,255,.18);color:#fff}.side .side-spacer{flex:1}}
</style><link rel="stylesheet" href="/static/css/mobile-responsive.css">
</head>
<body><nav class="side"><a class="logo" href="/">OS</a><a class="nav-link" href="/api/home"><i class="bi bi-speedometer2"></i><span>Dash</span></a><a class="nav-link" href="/dashboard/"><i class="bi bi-info-circle"></i><span>Main Info</span></a><a class="nav-link" href="/api/inventory-page/"><i class="bi bi-box"></i><span>Inventory</span></a><a class="nav-link" href="/billing/"><i class="bi bi-receipt"></i><span>Billing</span></a><a class="nav-link active" href="/api/purchase-page/"><i class="bi bi-bag"></i><span>Purchase</span></a><a class="nav-link" href="/api/items/"><i class="bi bi-grid-1x2"></i><span>Items</span></a><a class="nav-link" href="/api/vendors-page/"><i class="bi bi-people"></i><span>Vendors</span></a><a class="nav-link" href="/api/orders-page/"><i class="bi bi-truck"></i><span>Orders</span></a><a class="nav-link" href="/api/couriers-page/"><i class="bi bi-send"></i><span>Courier</span></a><span class="side-spacer"></span><a class="nav-link" href="/settings/"><i class="bi bi-gear"></i><span>Settings</span></a><a class="nav-link" href="/logout/"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></nav>
<div class="page"><header class="hero"><div class="heading"><a class="back" href="/api/purchase-page/"><i class="bi bi-arrow-left"></i></a><h1>Purchase Bill Details</h1><span class="badge" id="status"></span></div><div class="billbar"><b id="billNo">PB-</b><span id="billDate"></span></div></header>
<main class="body" id="detail"><p class="error">Loading purchase bill...</p></main></div>
<script>
const API=location.origin,id=new URLSearchParams(location.search).get("id");
function money(v){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(Number(v||0))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(v){return v?new Date(v+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"-"}
function initials(n){return (n||"?").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
function lineTotal(x){const stored=Number(x.total_price||0),calculated=Number(x.unit_price||0)*Number(x.quantity||0);return stored||calculated}
async function load(){if(!id){document.getElementById("detail").innerHTML='<p class="error">Bill ID missing.</p>';return}try{const r=await fetch(`${API}/api/purchase-detail/${id}/`,{headers:{"Accept":"application/json","X-Requested-With":"XMLHttpRequest"}});const b=await r.json();if(!r.ok)throw new Error(b.detail||b.error||"Bill not found.");const s=document.getElementById("status");s.textContent=b.status==="PARTIAL"?"PARTIAL PAID":b.status;s.className=`badge ${b.status}`;document.getElementById("billNo").textContent=b.bill_number;document.getElementById("billDate").textContent=fmtDate(b.bill_date);const tax=b.tax_fields||{};document.getElementById("detail").innerHTML=`
<section class="box vendor"><span class="avatar">${esc(initials(b.vendor.name))}</span><div><b>${esc(b.vendor.name)}</b><small>ID: ${b.vendor.id} &middot; ${esc(b.vendor.mobile)}</small></div></section>
<section class="box info"><p class="label">BILL INFO</p><p class="row"><span>Place of Supply</span><b>${esc(b.place_of_supply||"-")}</b></p><p class="row"><span>Bill Date</span><b>${fmtDate(b.bill_date)}</b></p></section>
<section class="box financial"><p class="row"><span>Subtotal</span><b>${money(b.subtotal)}</b></p><p class="row"><span>Discount</span><b>- ${money(b.discount)}</b></p><p class="row"><span>Shipping</span><b>+ ${money(b.shipping)}</b></p><div class="tax-break">TAX &amp; GST</div><p class="row"><span>GST Type</span><b>${b.gst_type==="with_gst"?"With GST":"No GST"}</b></p>${b.gst_type==="with_gst"?`<p class="row"><span>SGST</span><b>${tax.sgst_percent}%</b></p><p class="row"><span>CGST</span><b>${tax.cgst_percent}%</b></p><p class="row"><span>IGST</span><b>${tax.igst_percent}%</b></p>`:""}<p class="row"><span>Tax Amount</span><b>+ ${money(tax.tax_amount||0)}</b></p><p class="row"><span>Other Expense</span><b>+ ${money(b.other_expense)}</b></p><p class="row"><span>Round Off</span><b>${Number(b.round_off||0)>=0?"+ ":""}${money(b.round_off)}</b></p><p class="row total"><span>Total Amount</span><b>${money(b.total_amount)}</b></p><p class="row paid"><span>Paid Amount</span><b>${money(b.paid_amount)}</b></p><p class="row"><span>Paid Date</span><b>${fmtDate(b.paid_date)}</b></p>${b.status==="PARTIAL"?`<p class="row due"><span>Due Date</span><b>${fmtDate(b.payment_due_date)}</b></p>`:""}<p class="row due"><span>Outstanding</span><b>${money(b.remaining_amount)}</b></p></section>
<section class="items-wrap"><header class="items-head"><span>Purchased Items</span><span class="pill">${b.items.length} Items</span></header><div class="items">${b.items.map((x,i)=>`<article class="item"><div class="item-top"><span class="number">${i+1}</span><div><div class="item-name">${esc(x.product_name)}</div><div class="sku">SKU: ${esc(x.product_sku)}</div></div></div><div class="item-bottom"><span>${money(x.unit_price)} x ${x.quantity}</span><b>${money(lineTotal(x))}</b></div></article>`).join("")}</div></section>
${b.description?`<section class="note"><b>Note</b>${esc(b.description)}</section>`:""}`;}catch(e){document.getElementById("detail").innerHTML=`<p class="error">${esc(e.message)}</p>`}}
load();
</script><script src="/static/js/mobile-sidebar.js"></script>
</body></html>
