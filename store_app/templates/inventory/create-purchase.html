<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Purchase Bill - StockOS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
<style>
:root{--navy:#211d63;--indigo:#4c49d6;--ink:#18163d;--muted:#888794;--line:#e8e7ee;--bg:#fff;--soft:#fbfbfd;--red:#fb4343;--green:#24a047}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family: 'Google Sans', 'Product Sans', Arial, sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.side{display:none}.form{max-width:390px;margin:auto;padding:29px 19px 24px}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.top a{display:grid;place-items:center;height:32px;width:32px;border-radius:9px;color:var(--navy)}.top h1{font-size:18px;margin:0}.section{margin-bottom:27px}.section-title{font-size:9px;font-weight:600;letter-spacing:.14em;color:#506574;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.field{height:49px;border:1px solid var(--line);background:var(--soft);border-radius:11px;position:relative;display:flex;align-items:center}.field:focus-within{border-color:var(--navy)}.field i{position:absolute;left:14px;color:var(--navy);font-size:15px}.field input,.field select,.field textarea{border:0;background:transparent;outline:none;width:100%;height:100%;padding:0 13px 0 43px;font-family:inherit;color:var(--ink);font-size:12px}.field textarea{padding-top:17px;resize:none}.field.text{height:68px}.bill-label{position:absolute;top:-10px;left:13px;color:var(--muted);background:#fff;font-size:9px;padding:0 4px}.gst-box{grid-column:1/-1;border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:3px;background:var(--soft)}.switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}.switch button{height:33px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:10px;color:#656477}.switch .chosen{background:var(--navy);border-color:var(--navy);color:#fff}.gst-inputs{display:grid;grid-template-columns:1fr 1fr;gap:9px}.gst-inputs.igst{grid-template-columns:1fr}.items-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.items-head button{border:0;background:none;color:var(--navy);font-family:inherit;font-size:12px;font-weight:500}.item{display:grid;grid-template-columns:25px 1fr 26px;column-gap:8px;row-gap:9px;border:1px solid var(--line);background:#fdfdfe;padding:11px 10px;border-radius:11px;margin-bottom:10px}.index{height:20px;width:20px;background:var(--navy);border-radius:50%;color:#fff;font-size:10px;display:grid;place-items:center;margin-top:13px}.delete{border:0;background:none;color:var(--red);font-size:16px}.item-fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item-fields .product{grid-column:1/-1}.product-picker{overflow:visible;z-index:10}.product-picker.open{z-index:60}.product-picker input[type="hidden"]{display:none}.product-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);max-height:260px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 34px rgba(33,29,99,.16);padding:6px;z-index:70}.product-picker.open .product-menu{display:block}.product-option{width:100%;border:0;background:#fff;text-align:left;padding:9px 10px;border-radius:8px;font-family:inherit;font-size:12px;color:var(--ink);cursor:pointer}.product-option:hover,.product-option.active{background:#f1f0ff;color:var(--navy)}.product-empty{padding:12px 10px;color:var(--muted);font-size:12px}.actions{display:flex;gap:14px;padding-top:3px}.actions button{height:48px;border-radius:11px;border:1px solid var(--navy);font-family:inherit;font-weight:500;flex:1;background:#fff;color:var(--navy)}.actions .primary{background:linear-gradient(110deg,var(--navy),var(--indigo));border:0;color:#fff;box-shadow:0 6px 14px rgba(33,29,99,.18)}.message{min-height:20px;color:var(--red);font-size:11px}.disabled{opacity:.5;pointer-events:none}
@media(min-width:900px){body{background:#f7f6fc;padding-left:80px}.side{display:flex;position:fixed;left:0;top:0;bottom:0;width:80px;background:var(--navy);flex-direction:column;align-items:center;padding-top:22px;gap:8px}.side a{height:52px;width:57px;color:rgba(255,255,255,.65);display:grid;place-items:center;border-radius:12px}.side .logo{height:43px;width:43px;background:#fff;color:var(--navy);font-weight:700;margin-bottom:18px}.side .active{background:rgba(255,255,255,.17);color:#fff}.form{margin:22px auto 34px;max-width:620px;border-radius:18px;padding:26px 34px 30px;background:#fff;box-shadow:0 4px 22px rgba(33,29,99,.04)}.top{padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid #f0eff5}.top a{background:#f4f3fb}.top h1{font-size:23px}.desktop{display:block}.section{margin-bottom:25px}.field{height:52px}.items-col .item{padding:12px 10px}.actions{padding-top:4px}}
@media(min-width:900px){.side{padding:22px 0 16px;gap:4px;box-shadow:4px 0 30px rgba(27,23,93,.18)}.side .logo{width:42px;height:42px;border-radius:14px;margin-bottom:14px;font-size:15px;display:flex;align-items:center;justify-content:center}.side .sidebar-label{height:auto;width:auto;display:block;border-radius:0;color:rgba(255,255,255,.28);font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 4px}.side .nav-link{width:56px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;gap:4px;color:rgba(255,255,255,.48);font-size:9px}.side .nav-link i{font-size:18px}.side .nav-link:hover,.side .nav-link.active{background:rgba(255,255,255,.18);color:#fff}.side .side-spacer{flex:1}}
</style><link rel="stylesheet" href="/static/css/mobile-responsive.css">
</head><body><nav class="side"><a class="logo" href="/">OS</a><a class="nav-link" href="/api/home"><i class="bi bi-speedometer2"></i><span>Dash</span></a><a class="nav-link" href="/dashboard/"><i class="bi bi-info-circle"></i><span>Main Info</span></a><a class="nav-link" href="/api/inventory-page/"><i class="bi bi-box"></i><span>Inventory</span></a><a class="nav-link" href="/billing/"><i class="bi bi-receipt"></i><span>Billing</span></a><a class="nav-link active" href="/api/purchase-page/"><i class="bi bi-bag"></i><span>Purchase</span></a><a class="nav-link" href="/api/items/"><i class="bi bi-grid-1x2"></i><span>Items</span></a><a class="nav-link" href="/api/vendors-page/"><i class="bi bi-people"></i><span>Vendors</span></a><a class="nav-link" href="/api/orders-page/"><i class="bi bi-truck"></i><span>Orders</span></a><a class="nav-link" href="/api/couriers-page/"><i class="bi bi-send"></i><span>Courier</span></a><a class="nav-link" href="/api/leads-page/" title="Lead Management"><i class="bi bi-person-lines-fill"></i><span>Leads</span></a><span class="side-spacer"></span><a class="nav-link" href="/settings/"><i class="bi bi-gear"></i><span>Settings</span></a><a class="nav-link" href="/logout/"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></nav>
<form class="form" id="form"><header class="top"><a href="/api/purchase-page/"><i class="bi bi-arrow-left"></i></a><i class="bi bi-cart3"></i><h1 id="title">Create Purchase Bill</h1></header>
<div class="desktop"><section class="section"><p class="section-title">VENDOR & BILL DETAILS</p><div class="grid"><label class="field wide"><i class="bi bi-person"></i><select id="vendor" required><option value="">Select Vendor *</option></select></label><label class="field"><span class="bill-label">Bill No *</span><i class="bi bi-receipt"></i><input id="billNumber" placeholder="Enter bill number" required></label><label class="field"><span class="bill-label">Bill Date *</span><i class="bi bi-calendar"></i><input id="billDate" type="date" required></label><label class="field"><i class="bi bi-geo-alt"></i><input id="supply" placeholder="Place of Supply"></label><label class="field"><i class="bi bi-diagram-2"></i><select id="gstType"><option value="with_gst">With GST</option><option value="no_gst">No GST</option></select></label><div class="gst-box" id="gstBox"><div class="switch"><button type="button" id="split" class="chosen" onclick="taxMode('split')">SGST + CGST</button><button type="button" id="igst" onclick="taxMode('igst')">IGST Only</button></div><div class="gst-inputs" id="gstInputs"><label class="field"><i class="bi bi-percent"></i><input id="sgst" type="number" step=".01" placeholder="SGST %"></label><label class="field"><i class="bi bi-percent"></i><input id="cgst" type="number" step=".01" placeholder="CGST %"></label></div></div></div></section>
<section class="section items-col"><div class="items-head"><p class="section-title" style="margin:0">PURCHASE ITEMS</p><button type="button" onclick="addItem()"><i class="bi bi-plus-circle"></i> Add Item</button></div><div id="items"></div></section>
<section class="section"><p class="section-title">CHARGES & DISCOUNTS</p><div class="grid"><label class="field"><i class="bi bi-tags"></i><input id="discount" type="number" step=".01" placeholder="Discount"></label><label class="field"><i class="bi bi-truck"></i><input id="shipping" type="number" step=".01" placeholder="Shipping"></label><label class="field"><i class="bi bi-credit-card"></i><input id="other" type="number" step=".01" placeholder="Other Exp"></label><label class="field"><i class="bi bi-magic"></i><input id="round" type="number" step=".01" placeholder="Round Off"></label><label class="field text wide"><i class="bi bi-file-earmark-plus"></i><textarea id="description" placeholder="Internal Remarks/Description"></textarea></label></div></section>
<section class="section"><p class="section-title">PAYMENT INFORMATION</p><div class="grid"><label class="field wide"><i class="bi bi-info-circle"></i><select id="paymentStatus" disabled><option>UNPAID</option><option>PARTIAL</option><option>PAID</option></select></label><label class="field wide"><i class="bi bi-credit-card"></i><select id="mode"><option value="">Select Payment Mode</option><option value="cash">Cash</option><option value="upi">UPI</option><option value="bank_transfer">Bank Transfer / NEFT / RTGS</option></select></label><label class="field"><i class="bi bi-currency-rupee"></i><input id="paidAmount" type="number" step=".01" placeholder="Paid Amount"></label><label class="field"><i class="bi bi-calendar-check"></i><input id="paidDate" type="date"></label><label class="field wide" id="dueDateField" style="display:none"><span class="bill-label">Partial Due Date *</span><i class="bi bi-calendar-event"></i><input id="paymentDueDate" type="date"></label><label class="field wide"><i class="bi bi-hash"></i><input id="transaction" placeholder="Transaction ID / Reference"></label></div></section></div><p class="message" id="message"></p><div class="actions"><button type="button" onclick="location.href='/api/purchase-page/'">Cancel</button><button class="primary" id="submit" type="submit">Create Bill</button></div></form>
<script>
const API=location.origin, params=new URLSearchParams(location.search), editId=params.get("id");let products=[],vendors=[],itemCount=0, gstMode="split";
const $=id=>document.getElementById(id);function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function num(id){return Number($(id).value||0)}
async function get(url){const r=await fetch(url,{headers:{"Accept":"application/json","X-Requested-With":"XMLHttpRequest"},credentials:"same-origin"}),d=await r.json();if(!r.ok)throw new Error(d.error||d.detail||"Data load failed.");return d}
function productLabel(product){return product?`${product.name} - ${product.sku}`:""}
function productById(id){return products.find(x=>String(x.id)===String(id))}
function productMenuItems(input){const q=input.value.toLowerCase().trim();return (q?products.filter(p=>productLabel(p).toLowerCase().includes(q)):products).slice(0,80)}
function renderProductMenu(input){const menu=input.closest(".product-picker").querySelector(".product-menu"),items=productMenuItems(input);menu.innerHTML=items.length?items.map(p=>`<button class="product-option" type="button" data-id="${p.id}">${esc(productLabel(p))}</button>`).join(""):'<div class="product-empty">No product found</div>'}
function openProductPicker(input){document.querySelectorAll(".product-picker.open").forEach(p=>{if(!p.contains(input))p.classList.remove("open")});input.closest(".product-picker").classList.add("open");renderProductMenu(input)}
function filterProductPicker(input){input.closest(".product-picker").querySelector(".productSelect").value="";openProductPicker(input)}
function chooseProduct(button){const picker=button.closest(".product-picker"),hidden=picker.querySelector(".productSelect"),input=picker.querySelector(".productSearch"),product=productById(button.dataset.id);hidden.value=button.dataset.id;input.value=productLabel(product);picker.classList.remove("open");defaultPrice(hidden)}
document.addEventListener("click",e=>{if(e.target.matches(".product-option"))chooseProduct(e.target);else if(!e.target.closest(".product-picker"))document.querySelectorAll(".product-picker.open").forEach(p=>p.classList.remove("open"))});
function addItem(data={}){itemCount++;const selected=productById(data.product_id);const row=document.createElement("article");row.className="item";row.innerHTML=`<span class="index">${itemCount}</span><div class="item-fields"><div class="field product product-picker"><i class="bi bi-archive"></i><input class="productSearch" autocomplete="off" placeholder="Search / Select Product" value="${esc(productLabel(selected))}" onfocus="openProductPicker(this)" oninput="filterProductPicker(this)" required><input type="hidden" class="productSelect" value="${data.product_id||""}"><div class="product-menu"></div></div><label class="field"><i class="bi bi-hash"></i><input class="qty" required min="1" type="number" placeholder="Qty" value="${data.quantity||""}"></label><label class="field"><i class="bi bi-currency-rupee"></i><input class="price" required min="0" step=".01" type="number" placeholder="Price" value="${data.unit_price??""}"></label></div><button class="delete" type="button" onclick="this.closest('.item').remove();updateDueDate()"><i class="bi bi-trash"></i></button>`;$("items").appendChild(row);renderProductMenu(row.querySelector(".productSearch"));updateDueDate()}
function defaultPrice(select){const p=productById(select.value);if(p)select.closest(".item-fields").querySelector(".price").value=p.unit_purchase_price||0;updateDueDate()}
function taxMode(mode){gstMode=mode;$("split").classList.toggle("chosen",mode==="split");$("igst").classList.toggle("chosen",mode==="igst");$("gstInputs").className=`gst-inputs ${mode==="igst"?"igst":""}`;$("gstInputs").innerHTML=mode==="split"?'<label class="field"><i class="bi bi-percent"></i><input id="sgst" type="number" step=".01" placeholder="SGST %"></label><label class="field"><i class="bi bi-percent"></i><input id="cgst" type="number" step=".01" placeholder="CGST %"></label>':'<label class="field"><i class="bi bi-percent"></i><input id="igstRate" type="number" step=".01" placeholder="IGST %"></label>';updateDueDate()}
$("gstType").addEventListener("change",()=>{$("gstBox").style.display=$("gstType").value==="no_gst"?"none":"block";updateDueDate()});
function billSubtotal(){return [...document.querySelectorAll(".item")].reduce((sum,row)=>sum+Number(row.querySelector(".qty")?.value||0)*Number(row.querySelector(".price")?.value||0),0)}
function currentTotal(){const subtotal=billSubtotal(),taxable=Math.max(0,subtotal-num("discount"));let tax=0;if($("gstType").value==="with_gst"){tax=taxable*((gstMode==="split"?num("sgst")+num("cgst"):num("igstRate"))/100)}return taxable+tax+num("shipping")+num("other")+num("round")}
function updateDueDate(){const total=currentTotal(),paid=num("paidAmount"),partial=paid>0&&paid<total;$("paymentStatus").value=paid<=0?"UNPAID":(total>0&&paid>=total?"PAID":"PARTIAL");$("dueDateField").style.display=partial?"flex":"none";$("paymentDueDate").required=partial;if(!partial)$("paymentDueDate").value=""}
document.addEventListener("input",e=>{if(e.target.matches("#paidAmount,#discount,#shipping,#other,#round,#sgst,#cgst,#igstRate,.qty,.price"))updateDueDate()});
async function init(){try{const [vendorData,productData]=await Promise.all([get(`${API}/api/vendors/`),get(`${API}/api/products/`)]);vendors=vendorData.results||vendorData;products=productData.results||productData;$("vendor").innerHTML='<option value="">Select Vendor *</option>'+vendors.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join("");$("billDate").value=new Date().toISOString().slice(0,10);if(editId){const b=await get(`${API}/api/purchase-detail/${editId}/`);$("title").textContent="Edit Purchase Bill";$("submit").textContent="Update Bill";$("vendor").value=b.vendor.id;$("vendor").disabled=true;$("billNumber").value=b.bill_number;$("billDate").value=b.bill_date;$("supply").value=b.place_of_supply||"";$("gstType").value=b.gst_type;$("gstBox").style.display=b.gst_type==="no_gst"?"none":"block";if(b.tax_fields&&b.tax_fields.igst_percent){taxMode("igst");$("igstRate").value=b.tax_fields.igst_percent}else{taxMode("split");if(b.tax_fields){$("sgst").value=b.tax_fields.sgst_percent;$("cgst").value=b.tax_fields.cgst_percent}}$("discount").value=b.discount;$("shipping").value=b.shipping;$("other").value=b.other_expense;$("round").value=b.round_off;$("description").value=b.description||"";$("paymentStatus").value=b.status;$("mode").value=b.payment_mode||"";$("paidAmount").value=b.paid_amount;$("paidDate").value=b.paid_date||"";$("paymentDueDate").value=b.payment_due_date||"";$("transaction").value=b.transaction_id||"";updateDueDate();b.items.forEach(addItem)}else addItem()}catch(e){$("message").textContent=e.message}}
$("form").addEventListener("submit",async e=>{e.preventDefault();$("message").textContent="";const rows=[...document.querySelectorAll(".item")];if(!rows.length){$("message").textContent="Kam se kam ek purchase item add karein.";return}if(rows.some(r=>!r.querySelector(".productSelect").value)){$("message").textContent="Har item me product select karein.";return}const payload={vendor:$("vendor").value,bill_number:$("billNumber").value.trim(),bill_date:$("billDate").value,place_of_supply:$("supply").value,gst_type:$("gstType").value,sgst_percent:gstMode==="split"?num("sgst"):0,cgst_percent:gstMode==="split"?num("cgst"):0,igst_percent:gstMode==="igst"?num("igstRate"):0,discount:num("discount"),shipping:num("shipping"),other_expense:num("other"),round_off:num("round"),description:$("description").value,paid_amount:num("paidAmount"),paid_date:$("paidDate").value||null,payment_due_date:$("paymentDueDate").value||null,payment_mode:$("mode").value||null,transaction_id:$("transaction").value||null,items:rows.map(r=>({product:r.querySelector(".productSelect").value,quantity:r.querySelector(".qty").value,unit_price:r.querySelector(".price").value}))};const button=$("submit");button.disabled=true;try{const r=await fetch(editId?`${API}/api/purchase-update/${editId}/`:`${API}/api/purchase-item`,{method:editId?"PUT":"POST",headers:{"Content-Type":"application/json","Accept":"application/json","X-Requested-With":"XMLHttpRequest"},credentials:"same-origin",body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw new Error(d.detail||d.error||"Bill save nahi ho saka.");location.href=`/api/purchase-details-page/?id=${editId||d.bill_id}`}catch(err){$("message").textContent=err.message}finally{button.disabled=false}});
init();
</script><script src="/static/js/mobile-sidebar.js"></script>
</body></html>
