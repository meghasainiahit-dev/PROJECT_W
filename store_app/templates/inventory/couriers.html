<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courier Partners - StockOS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
<style>
:root{--ink:#0D0C2B;--brand:#1B175D;--brand-mid:#2E2A8A;--accent:#6C63FF;--surface:#F5F4FF;--card:#fff;--muted:#6B6A8A;--border:#E4E3F4;--danger:#EF4444;--green:#2EAA65}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Google Sans','Product Sans',Arial,sans-serif;background:var(--surface);color:var(--ink);min-height:100vh}.sidebar{width:80px;background:var(--brand);display:flex;flex-direction:column;align-items:center;padding:22px 0 16px;gap:4px;position:fixed;inset:0 auto 0 0;z-index:100;box-shadow:4px 0 30px rgba(27,23,93,.18)}.sidebar-logo{width:42px;height:42px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--brand);letter-spacing:-1px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.2);text-decoration:none}.sidebar-section-label{font-size:8px;font-weight:600;letter-spacing:.1em;color:rgba(255,255,255,.28);text-transform:uppercase;margin:8px 0 4px}.nav-link{width:56px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;color:rgba(255,255,255,.42);font-size:9px;font-weight:500;gap:4px;text-decoration:none;transition:.2s}.nav-link i{font-size:18px}.nav-link:hover,.nav-link.active{background:rgba(255,255,255,.18);color:#fff}.sidebar-spacer{flex:1}.main-wrap{margin-left:80px;min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);padding:0 30px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}.topbar h1{font-size:22px}.topbar a{height:38px;border-radius:11px;border:1px solid var(--border);padding:0 14px;display:inline-flex;align-items:center;gap:7px;color:var(--brand);text-decoration:none;background:#fff;font-size:13px;font-weight:700}.content{padding:28px 30px 38px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.04),0 4px 20px rgba(27,23,93,.06);overflow:hidden}.card-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.card-head h2{font-size:16px}.pill{background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}.list{display:grid}.courier-row{padding:16px 20px;border-bottom:1px solid var(--border);display:grid;gap:10px}.courier-row:last-child{border-bottom:0}.courier-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.courier-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}.courier-title i{color:var(--accent)}.row-actions{display:flex;gap:7px;flex-shrink:0}.row-action{height:31px;border:0;border-radius:9px;padding:0 10px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:5px}.row-action.edit{background:#EFF6FF;color:#2563EB}.row-action.delete{background:#FFF0F0;color:var(--danger)}.mediators{display:flex;gap:7px;flex-wrap:wrap}.mediator-chip{font-size:11px;font-weight:700;background:#F3F2FF;color:var(--brand);border-radius:999px;padding:5px 9px}.empty{padding:42px 20px;text-align:center;color:var(--muted)}form{padding:20px;display:grid;gap:13px}.field{display:grid;gap:7px}.field label{font-size:12px;color:var(--muted);font-weight:800}.input{height:44px;border:1.5px solid var(--border);border-radius:12px;background:#FBFBFD;padding:0 13px;font-family:inherit;color:var(--ink);outline:0}.input:focus{border-color:var(--accent);background:#fff}.mediator-lines{display:grid;gap:9px}.mediator-line{display:grid;grid-template-columns:1fr 36px;gap:8px}.icon-btn{border:0;border-radius:10px;background:#FFF0F0;color:#EF4444;cursor:pointer}.mini-add{height:34px;border:0;border-radius:10px;background:#F0EFF7;color:var(--brand);font-size:12px;font-weight:800;cursor:pointer}.form-actions{display:grid;grid-template-columns:1fr;gap:9px}.cancel-edit{display:none;height:40px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--brand);font-weight:800;font-family:inherit;cursor:pointer}.editing .cancel-edit{display:block}.submit{height:46px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;font-weight:800;font-family:inherit;cursor:pointer}.message{min-height:18px;font-size:12px}.message.error{color:var(--danger)}.message.success{color:var(--green)}@media(max-width:860px){.main-wrap{margin-left:0}.topbar{padding:0 14px 0 72px}.topbar h1{font-size:18px}.content{grid-template-columns:1fr;padding:18px 14px 28px}.card{border-radius:13px}.topbar a span{display:none}.courier-top{display:grid}.row-actions{width:100%}.row-action{flex:1;justify-content:center}}
</style>
<link rel="stylesheet" href="/static/css/mobile-responsive.css">
</head>
<body>
<nav class="sidebar">
    <a href="/api/home" class="sidebar-logo">OS</a>
    <span class="sidebar-section-label">Main</span>
    <a href="/api/home" class="nav-link"><i class="bi bi-speedometer2"></i><span>Dash</span></a>
    <a href="/dashboard/" class="nav-link"><i class="bi bi-info-circle"></i><span>Main Info</span></a>
    <a href="/api/inventory-page/" class="nav-link"><i class="bi bi-box"></i><span>Inventory</span></a>
    <a href="/billing/" class="nav-link"><i class="bi bi-receipt"></i><span>Billing</span></a>
    <a href="/api/purchase-page/" class="nav-link"><i class="bi bi-bag"></i><span>Purchase</span></a>
    <span class="sidebar-section-label">Stock</span>
    <a href="/api/items/" class="nav-link"><i class="bi bi-grid-1x2"></i><span>Items</span></a>
    <a href="/api/vendors-page/" class="nav-link"><i class="bi bi-people"></i><span>Vendors</span></a>
    <a href="/api/orders-page/" class="nav-link"><i class="bi bi-truck"></i><span>Orders</span></a>
    <a href="/api/couriers-page/" class="nav-link active"><i class="bi bi-send"></i><span>Courier</span></a>
    <div class="sidebar-spacer"></div>
    <a href="/settings/" class="nav-link"><i class="bi bi-gear"></i><span>Settings</span></a>
    <a href="/logout/" class="nav-link"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
</nav>
<div class="main-wrap">
    <header class="topbar">
        <h1>Courier Partners</h1>
        <a href="/dashboard/"><i class="bi bi-arrow-left"></i><span>Dashboard</span></a>
    </header>
    <main class="content">
        <section class="card">
            <div class="card-head">
                <h2>Saved Courier Partners</h2>
                <span class="pill" id="countPill">0 couriers</span>
            </div>
            <div class="list" id="courierList">
                <div class="empty">Loading couriers...</div>
            </div>
        </section>
        <section class="card" id="formCard">
            <div class="card-head"><h2 id="formTitle">Add Courier Partner</h2></div>
            <form id="courierForm">
                <div class="field">
                    <label>Courier Name</label>
                    <input class="input" name="title" placeholder="e.g. Delhivery" required>
                </div>
                <div class="field">
                    <label>Mediators</label>
                    <div class="mediator-lines" id="mediatorLines"></div>
                    <button class="mini-add" type="button" onclick="addMediatorLine()">+ Add Mediator</button>
                </div>
                <p class="message" id="message"></p>
                <div class="form-actions">
                    <button class="submit" type="submit">Create Courier</button>
                    <button class="cancel-edit" type="button" onclick="resetForm()">Cancel Edit</button>
                </div>
            </form>
        </section>
    </main>
</div>
<script>
const API_TOKEN_KEY="stockos_api_token";
let couriersCache=[];
let editingCourierId=null;
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function ensureToken(){const existing=localStorage.getItem(API_TOKEN_KEY);if(existing)return existing;const res=await fetch("/api/login/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({otp:"000000"})});const data=await res.json();if(!res.ok||!data.token)throw new Error(data.error||"API login failed");localStorage.setItem(API_TOKEN_KEY,data.token);return data.token}
async function apiFetch(url,options={},retry=true){const token=await ensureToken();const headers=new Headers(options.headers||{});headers.set("Authorization","Bearer "+token);if(!(options.body instanceof FormData)&&!headers.has("Content-Type"))headers.set("Content-Type","application/json");const res=await fetch(url,{...options,headers});if(res.status===401&&retry){localStorage.removeItem(API_TOKEN_KEY);return apiFetch(url,options,false)}return res}
function showMessage(text,type="error"){const message=document.getElementById("message");message.textContent=text;message.className=`message ${type}`}
function addMediatorLine(value=""){const row=document.createElement("div");row.className="mediator-line";row.innerHTML=`<input class="input" name="mediator_title" value="${esc(value)}" placeholder="Mediator name"><button class="icon-btn" type="button" onclick="this.parentElement.remove()"><i class="bi bi-trash"></i></button>`;document.getElementById("mediatorLines").appendChild(row)}
function renderCouriers(couriers){couriersCache=couriers;document.getElementById("countPill").textContent=`${couriers.length} ${couriers.length===1?"courier":"couriers"}`;document.getElementById("courierList").innerHTML=couriers.length?couriers.map(c=>`<article class="courier-row"><div class="courier-top"><div class="courier-title"><i class="bi bi-truck"></i>${esc(c.title)}</div><div class="row-actions"><button class="row-action edit" type="button" onclick="startEdit(${c.id})"><i class="bi bi-pencil"></i>Edit</button><button class="row-action delete" type="button" onclick="deleteCourier(${c.id})"><i class="bi bi-trash"></i>Delete</button></div></div><div class="mediators">${(c.mediators||[]).length?(c.mediators||[]).map(m=>`<span class="mediator-chip">${esc(m.title)}</span>`).join(""):'<span class="mediator-chip">No mediators</span>'}</div></article>`).join(""):'<div class="empty">No courier partners yet.</div>'}
async function loadCouriers(){const res=await apiFetch("/api/courier/list/");const data=await res.json();if(!res.ok)throw new Error(data.detail||data.error||"Courier partners load nahi ho paaye");renderCouriers(Array.isArray(data)?data:(data.data||[]))}
function resetForm(){editingCourierId=null;document.getElementById("courierForm").reset();document.getElementById("mediatorLines").innerHTML="";addMediatorLine();document.getElementById("formTitle").textContent="Add Courier Partner";document.getElementById("formCard").classList.remove("editing");document.querySelector(".submit").textContent="Create Courier";showMessage("")}
function startEdit(id){const courier=couriersCache.find(item=>Number(item.id)===Number(id));if(!courier)return;editingCourierId=id;document.getElementById("formTitle").textContent=`Edit ${courier.title}`;document.getElementById("formCard").classList.add("editing");document.querySelector('#courierForm [name="title"]').value=courier.title||"";document.getElementById("mediatorLines").innerHTML="";(courier.mediators||[]).forEach(mediator=>addMediatorLine(mediator.title));if(!(courier.mediators||[]).length)addMediatorLine();document.querySelector(".submit").textContent="Update Courier";showMessage("");document.getElementById("formCard").scrollIntoView({behavior:"smooth",block:"start"})}
async function deleteCourier(id){const courier=couriersCache.find(item=>Number(item.id)===Number(id));if(!courier)return;if(!confirm(`Delete ${courier.title}?`))return;try{const res=await apiFetch(`/api/courier/${id}/`,{method:"DELETE"});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||data.detail||"Courier delete nahi ho paaya");if(Number(editingCourierId)===Number(id))resetForm();showMessage(data.message||"Courier partner deleted.","success");await loadCouriers()}catch(e){showMessage(e.message)}}
document.getElementById("courierForm").addEventListener("submit",async event=>{event.preventDefault();showMessage("");const button=event.target.querySelector(".submit");const isEdit=Boolean(editingCourierId);button.disabled=true;button.textContent=isEdit?"Updating...":"Creating...";try{const titles=[...event.target.querySelectorAll('[name="mediator_title"]')].map(input=>input.value.trim()).filter(Boolean);const payload={title:event.target.title.value.trim(),mediators:titles.map(title=>({title}))};const res=await apiFetch(isEdit?`/api/courier/${editingCourierId}/`:"/api/courier/create/",{method:isEdit?"PUT":"POST",body:JSON.stringify(payload)});const data=await res.json();if(!res.ok)throw new Error(data.message||data.detail||data.error||(isEdit?"Courier update nahi ho paaya":"Courier create nahi ho paaya"));resetForm();showMessage(data.message||"Courier partner saved.","success");await loadCouriers()}catch(e){showMessage(e.message)}finally{button.disabled=false;button.textContent=editingCourierId?"Update Courier":"Create Courier"}});
addMediatorLine();
loadCouriers().catch(e=>{document.getElementById("courierList").innerHTML=`<div class="empty">${esc(e.message)}</div>`});
</script>
<script src="/static/js/mobile-sidebar.js"></script>
</body>
</html>
