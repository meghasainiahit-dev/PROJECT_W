<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchase Bills - StockOS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
<style>
:root{--navy:#211d63;--indigo:#5148da;--ink:#17153c;--muted:#858491;--line:#e9e8f0;--bg:#fafafd;--green:#25a244;--orange:#ff8900;--red:#f43c43;--blue:#078cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family: 'Google Sans', 'Product Sans', Arial, sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.side{display:none}.page{min-height:100vh;padding:27px 18px}.header{display:flex;align-items:center;gap:14px}.back{height:38px;width:38px;border:1px solid var(--line);border-radius:10px;background:#fff;display:grid;place-items:center;font-size:18px}.title h1{margin:0;font-size:21px}.title p{margin:2px 0 0;font-size:11px;color:var(--muted)}.tools{display:flex;gap:10px;margin:20px 0}.search{height:44px;position:relative;flex:1}.search i{position:absolute;top:14px;left:14px;color:var(--navy)}.search input{width:100%;height:100%;border:1px solid var(--line);border-radius:11px;padding:0 13px 0 42px;font-family:inherit;font-size:12px;outline:none}.search input:focus{border-color:var(--indigo)}.add{height:44px;width:45px;border:0;border-radius:12px;color:#fff;background:linear-gradient(110deg,var(--navy),var(--indigo));font-size:19px;box-shadow:0 5px 13px rgba(34,29,99,.22)}h2{font-size:17px;margin:0 0 13px}.bills{display:grid;gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 12px;display:grid;grid-template-columns:43px minmax(0,1fr) 88px;align-items:center;gap:12px;transition:box-shadow .18s,border-color .18s}.avatar{height:40px;width:40px;background:var(--navy);border-radius:11px;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:600}.name-row{margin-bottom:4px}.name{display:block;font-size:12px;font-weight:600;max-width:155px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:8px;border:1px solid;border-radius:6px;padding:4px 8px;white-space:nowrap}.PAID{color:var(--green);background:#edfaef}.UNPAID{color:var(--orange);background:#fff8ea}.PARTIAL{color:var(--blue);background:#eef7ff}.meta{color:var(--muted);font-size:9px;display:flex;gap:8px;align-items:center}.gst{background:#eee0fb;color:#8e44c6;border-radius:4px;font-weight:600;padding:2px 5px}.total small,.due small{font-size:8px;color:var(--muted);display:block}.total strong{font-size:13px}.due strong{font-size:11px;color:var(--red)}.values{display:flex;gap:18px;margin-top:8px}.card-side{align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:12px}.actions{display:flex;align-items:center;gap:7px}.icon{height:28px;width:28px;border:0;border-radius:7px;background:#f1f1f7;color:var(--navy)}.icon.delete{color:var(--red);background:#fff0f1}.next{color:#bbb;font-size:15px}.empty{background:#fff;border:1px dashed var(--line);border-radius:13px;padding:45px;text-align:center;color:var(--muted);font-size:13px}.error{color:var(--red);font-size:12px;margin-bottom:12px}
@media(min-width:900px){.side{display:flex;position:fixed;left:0;top:0;bottom:0;width:80px;background:var(--navy);align-items:center;flex-direction:column;padding-top:22px;gap:8px}.side a{height:54px;width:58px;border-radius:13px;color:rgba(255,255,255,.65);display:grid;place-items:center;font-size:10px}.side a i{font-size:20px}.side .brand{height:42px;width:42px;background:#fff;color:var(--navy);font-size:16px;font-weight:bold;margin-bottom:20px}.side .active{background:rgba(255,255,255,.18);color:#fff}.page{margin-left:80px;padding:32px 38px;width:calc(100% - 80px)}.title h1{font-size:27px}.title p{font-size:12px}.tools{width:100%;margin:28px 0}.add{width:126px;font-size:12px}.add:after{content:" New Bill";font-weight:600}.bills{width:100%;gap:12px}.card{height:104px;padding:17px 20px;grid-template-columns:56px minmax(0,1fr) 212px 188px;gap:16px;cursor:pointer}.card:hover{box-shadow:0 10px 24px rgba(32,28,96,.07);border-color:#dad7ed}.avatar{height:48px;width:48px}.name{font-size:14px;max-width:360px}.meta{font-size:11px;margin-top:2px}.values{margin:0;justify-content:flex-end;gap:22px}.total small,.due small{font-size:10px}.total strong{font-size:17px}.due strong{font-size:14px}.card-side{flex-direction:row;align-self:auto;align-items:center;justify-content:flex-end}.badge{font-size:9px}.actions{gap:9px}.icon{height:33px;width:33px}}
@media(min-width:900px){.side{padding:22px 0 16px;gap:4px;box-shadow:4px 0 30px rgba(27,23,93,.18)}.side .brand{width:42px;height:42px;border-radius:14px;margin-bottom:14px;font-size:15px;display:flex;align-items:center;justify-content:center}.side .sidebar-label{height:auto;width:auto;display:block;border-radius:0;color:rgba(255,255,255,.28);font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 4px}.side .nav-link{width:56px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;gap:4px;color:rgba(255,255,255,.48);font-size:9px}.side .nav-link i{font-size:18px}.side .nav-link:hover,.side .nav-link.active{background:rgba(255,255,255,.18);color:#fff}.side .side-spacer{flex:1}}
</style>
<link rel="stylesheet" href="/static/css/mobile-responsive.css">
</head>
<body>
<nav class="side"><a class="brand" href="/">OS</a><a class="nav-link" href="/api/home"><i class="bi bi-speedometer2"></i><span>Dash</span></a><a class="nav-link" href="/dashboard/"><i class="bi bi-info-circle"></i><span>Main Info</span></a><a class="nav-link" href="/api/inventory-page/"><i class="bi bi-box"></i><span>Inventory</span></a><a class="nav-link" href="/billing/"><i class="bi bi-receipt"></i><span>Billing</span></a><a class="nav-link active" href="/api/purchase-page/"><i class="bi bi-bag"></i><span>Purchase</span></a><a class="nav-link" href="/api/items/"><i class="bi bi-grid-1x2"></i><span>Items</span></a><a class="nav-link" href="/api/vendors-page/"><i class="bi bi-people"></i><span>Vendors</span></a><a class="nav-link" href="/api/orders-page/"><i class="bi bi-truck"></i><span>Orders</span></a><a class="nav-link" href="/api/couriers-page/"><i class="bi bi-send"></i><span>Courier</span></a><a class="nav-link" href="/api/leads-page/" title="Lead Management"><i class="bi bi-person-lines-fill"></i><span>Leads</span></a><span class="side-spacer"></span><a class="nav-link" href="/settings/"><i class="bi bi-gear"></i><span>Settings</span></a><a class="nav-link" href="/logout/"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></nav>
<main class="page">
<header class="header"><a class="back" href="/api/home"><i class="bi bi-arrow-left"></i></a><div class="title"><h1>Purchase Bills</h1><p>Manage all vendor purchases</p></div></header>
<div class="tools"><label class="search"><i class="bi bi-search"></i><input id="search" placeholder="Search bills, vendors, status..."></label><button class="add" type="button" onclick="openCreateBill()">+</button></div>
<h2>Recent Purchase Bills</h2><p class="error" id="message"></p><section class="bills" id="bills"><div class="empty">Loading purchase bills...</div></section>
</main>
<script>
const API=location.origin;let bills=[];
function money(value){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(Number(value||0))}
function safe(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function initials(name){return (name||"?").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
function token(){return localStorage.getItem("access")||localStorage.getItem("access_token")||""}
async function apiFetch(url,options={}){const h={"Content-Type":"application/json","Accept":"application/json","X-Requested-With":"XMLHttpRequest",...(options.headers||{})};return fetch(url,{...options,headers:h,credentials:"same-origin"})}
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const rows=bills.filter(b=>[b.bill_number,b.vendor?.name,b.status].some(x=>String(x||"").toLowerCase().includes(q)));
 document.getElementById("bills").innerHTML=rows.length?rows.map(b=>`<article class="card" onclick="openBill(${b.id})">
 <span class="avatar">${safe(initials(b.vendor?.name))}</span><div><div class="name-row"><span class="name">${safe(b.vendor?.name)}</span></div>
 <div class="meta"><span><i class="bi bi-receipt"></i> ${safe(b.bill_number)}</span>${b.gst_type==="with_gst"?'<span class="gst">GST</span>':""}</div><div class="meta"><span><i class="bi bi-calendar3"></i> ${safe(b.bill_date)}</span><span><i class="bi bi-list-check"></i> ${b.items.length} Items</span></div>
 </div><div class="values"><span class="total"><small>Total</small><strong>${money(b.total_amount)}</strong></span>${Number(b.remaining_amount)>0?`<span class="due"><small>Due</small><strong>${money(b.remaining_amount)}</strong></span>`:""}</div>
 <div class="card-side"><span class="badge ${safe(b.status)}">${safe(b.status==="PARTIAL"?"PARTIAL PAID":b.status)}</span><div class="actions"><button class="icon" onclick="editBill(event,${b.id})"><i class="bi bi-pencil"></i></button><button class="icon delete" onclick="deleteBill(event,${b.id})"><i class="bi bi-trash"></i></button><i class="bi bi-chevron-right next"></i></div></div></article>`).join(""):'<div class="empty">No purchase bills found.</div>';
}
async function loadBills(){try{const response=await apiFetch(`${API}/api/purchase-list`);const data=await response.json();if(!response.ok)throw new Error(data.detail||data.error||"Bills could not be loaded.");bills=data.results||[];render()}catch(error){document.getElementById("message").textContent=error.message;document.getElementById("bills").innerHTML='<div class="empty">Purchase data unavailable.</div>'}}
function openBill(id){location.href=`/api/purchase-details-page/?id=${id}`}
function openCreateBill(){location.href="/api/purchase-create-page/"}
function editBill(event,id){event.stopPropagation();location.href=`/api/purchase-create-page/?id=${id}`}
async function deleteBill(event,id){event.stopPropagation();const button=event.currentTarget;if(!confirm("Delete this purchase bill? Inventory stock will be adjusted."))return;button.disabled=true;document.getElementById("message").textContent="";try{const r=await apiFetch(`${API}/api/purchase-delete/${id}/`,{method:"DELETE"});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.detail||d.error||"Delete failed.");bills=bills.filter(b=>String(b.id)!==String(id));render();document.getElementById("message").textContent=d.message||"Purchase bill deleted successfully."}catch(e){alert(e.message);document.getElementById("message").textContent=e.message}finally{button.disabled=false}}
document.getElementById("search").addEventListener("input",render);loadBills();
</script>
<script src="/static/js/mobile-sidebar.js"></script>
</body>
</html>
